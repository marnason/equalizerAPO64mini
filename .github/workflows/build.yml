name: Build and nightly release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release

jobs:
  verify-source:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Verify repository shape
        shell: pwsh
        run: ./ci/verify-source.ps1

  build-apo:
    needs: verify-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: apo-x64-avx2
            os: windows-2022
            platform: x64
            instruction_set: AdvancedVectorExtensions2
          - artifact: apo-x64-avx512
            os: windows-2022
            platform: x64
            instruction_set: AdvancedVectorExtensions512
          - artifact: apo-x64-avx10_1
            os: windows-2022
            platform: x64
            instruction_set: AdvancedVectorExtensions101
          - artifact: apo-arm64
            os: windows-11-arm
            platform: ARM64
            instruction_set: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: ${{ matrix.platform }}
      - name: Build APO
        shell: pwsh
        run: |
          $properties = @(
            "/m", "/t:Rebuild",
            "/p:Configuration=${{ env.BUILD_CONFIGURATION }}",
            "/p:Platform=${{ matrix.platform }}"
          )
          if ("${{ matrix.platform }}" -eq "x64") {
            $properties += "/p:EnableEnhancedInstructionSet=${{ matrix.instruction_set }}"
          }
          msbuild Common.vcxproj @properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild EqualizerAPO/EqualizerAPO.vcxproj @properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify runtime primitives
        if: matrix.artifact == 'apo-x64-avx2'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VS_PATH=%%i
          call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64
          powershell -NoProfile -ExecutionPolicy Bypass -File ci\verify-runtime.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: EqualizerAPO/${{ matrix.platform }}/Release/EqualizerAPO.dll
          if-no-files-found: error

  build-control:
    needs: verify-source
    strategy:
      matrix:
        include:
          - artifact: control-x64
            os: windows-2022
            platform: x64
            qt_arch: win64_msvc2022_64
            qt_host: windows
            dev_arch: x64
          - artifact: control-arm64
            os: windows-11-arm
            platform: ARM64
            qt_arch: win64_msvc2022_arm64
            qt_host: windows_arm64
            dev_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: ${{ matrix.platform }}
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          dir: '${{ github.workspace }}\Qt'
          install-deps: true
          set-env: true
          archives: qtbase qttools
          cache: true
      - name: Build Common
        run: msbuild Common.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=${{ matrix.platform }}
      - name: Build control application
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VS_PATH=%%i
          call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=${{ matrix.dev_arch }}
          mkdir build-control
          cd build-control
          qmake ..\DeviceSelector\DeviceSelector.pro CONFIG+=release
          if errorlevel 1 exit /b %errorlevel%
          nmake
          if errorlevel 1 exit /b %errorlevel%
          windeployqt release\EqualizerAPO.exe --release --no-opengl-sw
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: build-control/release/
          if-no-files-found: error

  create-installer:
    needs: [build-apo, build-control]
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: x64-avx2
            apo_artifact: apo-x64-avx2
            control_artifact: control-x64
            setup: Setup64
          - variant: x64-avx512
            apo_artifact: apo-x64-avx512
            control_artifact: control-x64
            setup: Setup64
          - variant: x64-avx10_1
            apo_artifact: apo-x64-avx10_1
            control_artifact: control-x64
            setup: Setup64
          - variant: arm64
            apo_artifact: apo-arm64
            control_artifact: control-arm64
            setup: SetupARM64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.apo_artifact }}
          path: staging/bin
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.control_artifact }}
          path: staging/control
      - name: Prepare payload
        shell: pwsh
        run: |
          Copy-Item staging/control/EqualizerAPO.exe staging/bin/
          New-Item -ItemType Directory -Force staging/qt | Out-Null
          Get-ChildItem staging/control | Where-Object Name -ne "EqualizerAPO.exe" | Copy-Item -Destination staging/qt -Recurse
      - uses: negrutiu/nsis-install@v2
      - uses: negrutiu/nsis-install-plugin@v1
        with:
          url: https://nsis.sourceforge.io/mediawiki/images/9/97/NsArray.zip
      - uses: negrutiu/nsis-install-plugin@v1
        with:
          url: https://github.com/mazinsw/NSISpcre/archive/refs/heads/master.zip
      - name: Build installer
        shell: pwsh
        run: |
          makensis "/DBINPATH=$pwd\staging\bin" "/DLIBPATH=$pwd\staging\qt" "/DINSTALLER_OUTFILE=EqualizerAPO-nightly-${{ matrix.variant }}.exe" "Setup\${{ matrix.setup }}.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer payload
        shell: pwsh
        run: ./ci/verify-package.ps1 -Installer "Setup/EqualizerAPO-nightly-${{ matrix.variant }}.exe" -Variant "${{ matrix.variant }}"
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.variant }}
          path: Setup/EqualizerAPO-nightly-${{ matrix.variant }}.exe
          if-no-files-found: error

  nightly-release:
    needs: create-installer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: release
          merge-multiple: true
      - name: Create checksums and release metadata
        id: metadata
        shell: bash
        run: |
          cd release
          sha256sum EqualizerAPO-nightly-*.exe > SHA256SUMS.txt
          commit_time=$(git -C .. show -s --format=%cI "$GITHUB_SHA")
          timestamp=$(date -u -d "$commit_time" +%Y%m%d-%H%M%S)
          display_time=$(date -u -d "$commit_time" '+%Y-%m-%d %H:%M UTC')
          short_sha=${GITHUB_SHA::7}
          echo "tag=nightly-${timestamp}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "title=Nightly ${display_time} (${short_sha})" >> "$GITHUB_OUTPUT"
      - name: Publish immutable nightly
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          TITLE: ${{ steps.metadata.outputs.title }}
        shell: bash
        run: |
          notes=$(printf 'Automated nightly for [%s](%s/commit/%s).\n\n[Workflow run](%s/actions/runs/%s)\n\nIncludes x64 AVX2, x64 AVX-512, x64 AVX10.1, and ARM64 installers.' "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$notes" --prerelease
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "$TITLE" --notes "$notes" --prerelease
          fi
