name: Build EqualizerAPO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-avx2
            os: windows-2022
            platform: x64
            simd_variant: avx2
            instruction_set: AdvancedVectorExtensions2
            qt_arch: win64_msvc2022_64
            dev_arch: x64
          - name: windows-x64-avx512
            os: windows-2022
            platform: x64
            simd_variant: avx512
            instruction_set: AdvancedVectorExtensions512
            qt_arch: win64_msvc2022_64
            dev_arch: x64
          - name: windows-x64-avx10_1
            os: windows-2022
            platform: x64
            simd_variant: avx10_1
            instruction_set: AdvancedVectorExtensions101
            qt_arch: win64_msvc2022_64
            dev_arch: x64
          - name: windows-arm64
            os: windows-11-arm
            platform: ARM64
            simd_variant: neon
            instruction_set: ""
            qt_arch: win64_msvc2022_arm64
            dev_arch: x86_arm64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: ${{ matrix.platform }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          host: ${{ matrix.platform == 'ARM64' && 'windows_arm64' || 'windows' }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          dir: '${{ github.workspace }}\Qt'
          install-deps: 'true'
          set-env: 'true'
          archives: 'qtbase qtsvg'
          cache: 'true'

      - name: Build APO libraries
        shell: pwsh
        run: |
          $parameters = @(
            "/m",
            "/p:Configuration=${{ env.BUILD_CONFIGURATION }}",
            "/p:Platform=${{ matrix.platform }}",
            "/p:PlatformToolset=v143",
            "/t:Rebuild"
          )
          if ("${{ matrix.platform }}" -eq "x64") {
            $parameters += "/p:EnableEnhancedInstructionSet=${{ matrix.instruction_set }}"
          }
          foreach ($project in @("Common.vcxproj", "EqualizerAPO\EqualizerAPO.vcxproj")) {
            msbuild $project @parameters
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.dev_arch }}

      - name: Build DeviceSelector
        shell: pwsh
        run: |
          $buildDir = "build-DeviceSelector-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null
          Set-Location $buildDir
          if ("${{ matrix.platform }}" -eq "x64") {
            $flag = switch ("${{ matrix.simd_variant }}") {
              "avx512" { "/arch:AVX512" }
              "avx10_1" { "/arch:AVX10.1" }
              default { "/arch:AVX2" }
            }
            qmake ..\DeviceSelector\DeviceSelector.pro -r "CONFIG+=release" "QMAKE_CXXFLAGS-=/arch:AVX2" "QMAKE_CXXFLAGS+=$flag"
          } else {
            qmake ..\DeviceSelector\DeviceSelector.pro -r "CONFIG+=release"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          windeployqt release\DeviceSelector.exe --release --no-opengl-sw
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package binaries
        shell: pwsh
        run: |
          $artifactPath = "${{ github.workspace }}\artifacts\EqualizerAPO-${{ matrix.platform }}-${{ matrix.simd_variant }}"
          New-Item -ItemType Directory -Force -Path $artifactPath | Out-Null
          Copy-Item "EqualizerAPO\${{ matrix.platform }}\Release\EqualizerAPO.dll" $artifactPath
          Copy-Item "build-DeviceSelector-${{ matrix.platform }}\release\*" $artifactPath -Recurse

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EqualizerAPO-${{ matrix.platform }}-${{ matrix.simd_variant }}
          path: artifacts/EqualizerAPO-${{ matrix.platform }}-${{ matrix.simd_variant }}/
          if-no-files-found: error
          retention-days: 90

  create-installer:
    needs: build
    runs-on: windows-2025
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - platform: x64
            simd_variant: avx2
            setup_file: Setup64
            installer_name: x64-avx2
          - platform: x64
            simd_variant: avx512
            setup_file: Setup64
            installer_name: x64-avx512
          - platform: x64
            simd_variant: avx10_1
            setup_file: Setup64
            installer_name: x64-avx10_1
          - platform: ARM64
            simd_variant: neon
            setup_file: SetupARM64
            installer_name: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: EqualizerAPO-${{ matrix.platform }}-${{ matrix.simd_variant }}
          path: artifact

      - name: Prepare installer files
        shell: pwsh
        run: |
          $bin = "${{ github.workspace }}\${{ matrix.platform }}\Release"
          $lib = "${{ github.workspace }}\lib64"
          New-Item -ItemType Directory -Force -Path $bin, $lib | Out-Null
          Copy-Item artifact\EqualizerAPO.dll, artifact\DeviceSelector.exe $bin
          Get-ChildItem artifact | Where-Object { $_.Name -notin @("EqualizerAPO.dll", "DeviceSelector.exe") } | Copy-Item -Destination $lib -Recurse

      - name: Install NSIS
        uses: negrutiu/nsis-install@v2

      - name: Install NsArray
        uses: negrutiu/nsis-install-plugin@v1
        with:
          url: https://nsis.sourceforge.io/mediawiki/images/9/97/NsArray.zip

      - name: Install NSISpcre
        uses: negrutiu/nsis-install-plugin@v1
        with:
          url: https://github.com/mazinsw/NSISpcre/archive/refs/heads/master.zip

      - name: Build installer
        run: makensis ${{ github.workspace }}\Setup\${{ matrix.setup_file }}.nsi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EqualizerAPO_Setup-${{ matrix.installer_name }}
          path: Setup/*.exe
          if-no-files-found: error
          retention-days: 90
